[terminal]
default_shell = "nu"

[keys]
prefix = "ctrl+s"

focus_pane_left  = ["prefix+h", "alt+h"]
focus_pane_down  = ["prefix+j", "alt+j"]
focus_pane_up    = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

resize_mode = "prefix+space"

swap_pane_left  = "prefix+shift+h"
swap_pane_down  = ["prefix+shift+j", "prefix+s", "alt+s"]
swap_pane_up    = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

split_horizontal = ["prefix+minus", "alt+minus"]
split_vertical   = ["prefix+=", "alt+="]
close_pane       = ["prefix+x", "alt+x"]

new_workspace      = ["prefix+shift+w", "alt+shift+w"]
next_workspace     = "prefix+."
previous_workspace = "prefix+,"
rename_workspace   = ["prefix+r", "alt+r"]
workspace_picker   = ["prefix+w", "alt+w"]
switch_workspace   = "prefix+1..9"

new_tab      = ["prefix+shift+n", "alt+shift+n", "prefix+c"]
next_tab     = ["prefix+n", "alt+n"]
previous_tab = ["prefix+p", "alt+p"]
switch_tab   = "prefix+alt+1..9"

toggle_sidebar = ["prefix+\\", "alt+\\", "prefix+b"]
settings       = "prefix+shift+s"

[theme]
name = "solarized"
auto_switch = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = false
pane_gaps = false
sidebar_collapsed_mode = "hidden"

agent_panel_sort = "priority"
[experimental]
pane_history = false
